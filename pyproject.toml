[project]
name = "rescale-bedrock-kb"
version = "0.1.0"
description = "Build and compare two Amazon Bedrock knowledge bases over a large PDF user guide."
requires-python = ">=3.12"

dependencies = [
    # AWS / Bedrock
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    # PDF parsing / chunking
    "pypdf>=6.1.0",
    # config + CLI ergonomics
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
kb = "rescale_bedrock_kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescale_bedrock_kb"]

[tool.ruff]
line-length = 100
target-version = "py312"
